{{ define "projects" }}
<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Projects</h1>
    <div class="relative">
      <input type="text" id="search-input" placeholder="Search projects..."
        class="w-64 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        hx-get="/projects/search" hx-trigger="keyup changed delay:500ms" hx-target="#projects-grid"
        hx-indicator="#search-indicator">
      <div id="search-indicator" class="htmx-indicator absolute right-3 top-2">
        <svg class="animate-spin h-5 w-5 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
      </div>
    </div>
  </div>

  <div id="projects-grid" class="space-y-4">
    {{ template "project_list_content" . }}
  </div>

  {{ if .has_more_projects }}
  {{ template "load_more_oob" . }}
  {{ end }}
</div>
{{ end }}
