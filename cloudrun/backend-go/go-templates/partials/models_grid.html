{{ define "partials/models_grid.html" }}
<div class="models-grid" data-model-ids='{{ .model_ids | json }}'>
  <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4 p-4 bg-white">
    {{ range .models }}
    <div class="model-card border border-gray-200 rounded bg-white shadow-sm overflow-hidden">
      <div class="h-32 flex items-center justify-center bg-gray-100">
        <svg class="model-image throbber animate-spin h-8 w-8 text-gray-400" data-model-id="{{ .ID }}"
          xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
      </div>
      <div class="p-2">
        <div class="font-medium text-gray-800 truncate">{{ .Name }}</div>
        {{ if .Description }}
        <div class="text-xs text-gray-600 truncate">{{ .Description }}</div>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
